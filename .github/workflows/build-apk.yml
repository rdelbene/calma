name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Preparar clave de firma (si está configurada)
        env:
          KS_B64: ${{ secrets.CALMA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/calma.jks"
            echo "CALMA_KEYSTORE_FILE=$RUNNER_TEMP/calma.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          CALMA_KEYSTORE_PASSWORD: ${{ secrets.CALMA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PcalmaVersionCode=${{ github.run_number }} -PcalmaVersionName=2.0.${{ github.run_number }}

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Calma.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Calma-apk
          path: Calma.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Calma v2.0.${{ github.run_number }}
          body: |
            Descargá **Calma.apk** desde acá abajo e instalala en tu Android.
            (Puede que tengas que permitir "instalar apps de origen desconocido".)
          files: Calma.apk
