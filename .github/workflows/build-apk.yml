name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Preparar clave de firma
        env:
          KS_B64: ${{ secrets.CALMA_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.CALMA_KEYSTORE_PASSWORD }}
        run: |
          # Si hay secretos cargados se usan esos; si no, la clave guardada en android/keystore.
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/calma.jks"
            echo "CALMA_KEYSTORE_FILE=$RUNNER_TEMP/calma.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KS_PW"
            echo "CALMA_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          else
            echo "CALMA_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/keystore/calma.jks" >> "$GITHUB_ENV"
            echo "CALMA_KEYSTORE_PASSWORD=$(cat android/keystore/password.txt)" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PcalmaVersionCode=${{ github.run_number }} -PcalmaVersionName=2.0.${{ github.run_number }}

      - name: Verificar firma fija
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "CN=Calma"

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Calma.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Calma-apk
          path: Calma.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Calma v2.0.${{ github.run_number }}
          body: |
            Descargá **Calma.apk** desde acá abajo e instalala en tu Android.
            Se instala encima de la versión anterior, sin desinstalar (desde la v2.0 firmada con la clave fija).
            (Puede que tengas que permitir "instalar apps de origen desconocido".)
          files: Calma.apk
